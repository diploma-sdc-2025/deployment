version: "3.9"

services:

  auth-service:
    build: ../auth-service
    ports:
      - "8081:8080"
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      SERVER_PORT: 8080
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_SERVER}.postgres.database.azure.com:${DB_PORT}/${AUTH_DB_NAME}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_SERVER: ${DB_SERVER}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${AUTH_DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_USER: ${AUTH_APP_USER}
      APP_PASSWORD: ${AUTH_APP_PASSWORD}

  matchmaking-service:
    build: ../matchmaking-service
    ports:
      - "8082:8080"
    networks:
      - backend
      - cache
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      SERVER_PORT: 8080
      # Optional local debugging: add dev profile for POST /api/matchmaking/dev/purge-redis (clears stale queue/assignments)
      # SPRING_PROFILES_ACTIVE: dev
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_SERVER}.postgres.database.azure.com:${DB_PORT}/${MATCHMAKING_DB_NAME}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_SERVER: ${DB_SERVER}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${MATCHMAKING_DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_USER: ${MATCHMAKING_APP_USER}
      APP_PASSWORD: ${MATCHMAKING_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GAME_SERVICE_URL: http://game-service:8080
    depends_on:
      - redis
      - game-service

  game-service:
    build: ../game-service
    ports:
      - "8083:8080"
    networks:
      - backend
      - cache
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SERVER_PORT: 8080
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_SERVER}.postgres.database.azure.com:${DB_PORT}/${GAME_DB_NAME}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_SERVER: ${DB_SERVER}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${GAME_DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_USER: ${GAME_APP_USER}
      APP_PASSWORD: ${GAME_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DIPLOMA_BATTLE_SERVICE_URL: http://battle-service:8080
      # Same keys as auth-service for POST /api/internal/match-rating (rating ±10 after matches).
      AUTH_SERVICE_URL: http://auth-service:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-dev-internal-secret}
    depends_on:
      - redis
      - auth-service

  battle-service:
    build: ../battle-service
    ports:
      - "8084:8080"
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SERVER_PORT: 8080
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_SERVER}.postgres.database.azure.com:${DB_PORT}/${BATTLE_DB_NAME}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_SERVER: ${DB_SERVER}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${BATTLE_DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_USER: ${BATTLE_APP_USER}
      APP_PASSWORD: ${BATTLE_APP_PASSWORD}

  analytics-service:
    build: ../analytics-service
    ports:
      - "8080:8080"
    networks:
      - backend
      - cache
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      SERVER_PORT: 8080
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_SERVER}.postgres.database.azure.com:${DB_PORT}/${ANALYTICS_DB_NAME}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_SERVER: ${DB_SERVER}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${ANALYTICS_DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_USER: ${ANALYTICS_APP_USER}
      APP_PASSWORD: ${ANALYTICS_APP_PASSWORD}
      ANALYTICS_ADMIN_USERS: ${ANALYTICS_ADMIN_USERS:-kon}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-dev-internal-secret}
    depends_on:
      - redis
      - auth-service

  redis:
    image: redis:7
    networks:
      - cache
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - redis-data:/data

volumes:
  redis-data:

networks:
  backend:
  cache:
